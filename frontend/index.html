<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serverless To-Do</title>
<style>
  :root {
    --bg: #eef2f4;
    --surface: #ffffff;
    --ink: #17232d;
    --muted: #5d6b76;
    --line: #d3dce1;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --danger: #a3341f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11191f;
      --surface: #19242c;
      --ink: #e8eef1;
      --muted: #93a3ad;
      --line: #2b3a44;
      --accent: #3fb59f;
      --accent-ink: #08201b;
      --danger: #e5826c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 Georgia, "Times New Roman", serif;
    padding: 2rem 1rem;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 2rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 1.5rem; }
  button, input { font: inherit; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0;
    padding: .55rem 1rem; border-radius: 6px; cursor: pointer;
  }
  button.plain { background: none; color: var(--muted); padding: .25rem .5rem; }
  button.plain:hover { color: var(--danger); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  form { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  input[type=text] {
    flex: 1; padding: .55rem .75rem; border: 1px solid var(--line);
    border-radius: 6px; background: var(--surface); color: var(--ink);
  }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; align-items: center; gap: .75rem; padding: .7rem .9rem;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; margin-bottom: .5rem;
  }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: var(--muted); }
  #msg { color: var(--muted); min-height: 1.5rem; }
  #msg.error { color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>My to-do list</h1>
  <p class="sub">Each person sees only their own tasks.</p>

  <section id="signedOut">
    <button id="loginBtn">Sign in</button>
  </section>

  <section id="signedIn" hidden>
    <form id="addForm">
      <input type="text" id="title" placeholder="What needs doing?" aria-label="New task" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="list"></ul>
    <p><button class="plain" id="logoutBtn">Sign out</button></p>
  </section>

  <p id="msg" role="status"></p>
</main>

<script>
// ===== FILL THESE IN AFTER YOU CREATE COGNITO + API GATEWAY =====
const CONFIG = {
  cognitoDomain: "https://us-east-1c4sisw0p2.auth.us-east-1.amazoncognito.com",
  clientId: "59cmlbi3hjqhimh6nsr8r5vgvc",
  apiUrl: "https://jrhwe6qo86.execute-api.us-east-1.amazonaws.com/prod"
};
// Must match a Callback URL in your Cognito app client exactly.
const REDIRECT = window.location.origin + window.location.pathname;

const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("id_token");

// Cognito hosted UI (implicit flow) returns the token in the URL after "#".
if (location.hash.includes("id_token=")) {
  token = new URLSearchParams(location.hash.slice(1)).get("id_token");
  sessionStorage.setItem("id_token", token);
  history.replaceState(null, "", REDIRECT);
}

function say(text, isError) {
  $("msg").textContent = text || "";
  $("msg").className = isError ? "error" : "";
}

async function api(path, method, body) {
  const res = await fetch(CONFIG.apiUrl + path, {
    method,
    headers: { "Authorization": token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 401) {
    sessionStorage.removeItem("id_token");
    token = null;
    show();
    throw new Error("Your session expired. Sign in again.");
  }
  if (!res.ok) throw new Error("Request failed (" + res.status + ")");
  return res.json();
}

async function load() {
  try {
    const items = await api("/todos", "GET");
    $("list").innerHTML = "";
    if (!items.length) say("No tasks yet. Add your first one above.");
    else say("");
    items.forEach(render);
  } catch (e) { say(e.message, true); }
}

function render(item) {
  const li = document.createElement("li");
  if (item.status === "done") li.className = "done";
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = item.status === "done";
  box.setAttribute("aria-label", "Mark done: " + item.title);
  box.onchange = async () => {
    try {
      await api("/todos/" + item.todoId, "PUT",
        { title: item.title, status: box.checked ? "done" : "open" });
      load();
    } catch (e) { say(e.message, true); }
  };
  const text = document.createElement("span");
  text.textContent = item.title;
  const del = document.createElement("button");
  del.className = "plain"; del.textContent = "Delete";
  del.onclick = async () => {
    try { await api("/todos/" + item.todoId, "DELETE"); load(); }
    catch (e) { say(e.message, true); }
  };
  li.append(box, text, del);
  $("list").append(li);
}

$("addForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/todos", "POST", { title: $("title").value });
    $("title").value = "";
    load();
  } catch (err) { say(err.message, true); }
};

$("loginBtn").onclick = () => {
  location.href = CONFIG.cognitoDomain + "/login?client_id=" + CONFIG.clientId +
    "&response_type=token&scope=openid+email&redirect_uri=" + encodeURIComponent(REDIRECT);
};

$("logoutBtn").onclick = () => {
  sessionStorage.removeItem("id_token");
  location.href = CONFIG.cognitoDomain + "/logout?client_id=" + CONFIG.clientId +
    "&logout_uri=" + encodeURIComponent(REDIRECT);
};

function show() {
  $("signedOut").hidden = !!token;
  $("signedIn").hidden = !token;
  if (token) load();
}
show();
</script>
</body>
</html>
